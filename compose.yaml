services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: advisor
      POSTGRES_USER: advisor
      POSTGRES_PASSWORD: advisor
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advisor -d advisor"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    env_file:
      - path: .env
        required: false
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://advisor:advisor@postgres:5432/advisor
      TEST_DATABASE_URL: postgresql://advisor:advisor@postgres:5432/advisor
      DATA_DIR: /workspace/data
      DEFAULT_COLLECTION: ${DEFAULT_COLLECTION:-default}
      LLM_PROVIDER: ${LLM_PROVIDER:-hf-local}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-granite}
    volumes:
      - ./backend:/workspace/backend
      - ./data:/workspace/data
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:5173:5173"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  worker:
    env_file:
      - path: .env
        required: false
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://advisor:advisor@postgres:5432/advisor
      DATA_DIR: /workspace/data
      DEFAULT_COLLECTION: ${DEFAULT_COLLECTION:-default}
      LLM_PROVIDER: ${LLM_PROVIDER:-hf-local}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-granite}
    command: ["python", "-m", "scripts.worker"]
    volumes:
      - ./backend:/workspace/backend
      - ./data:/workspace/data
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /workspace/frontend
    environment:
      VITE_API_MODE: http
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/workspace/frontend
      - frontend_node_modules:/workspace/frontend/node_modules
    network_mode: "service:backend"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
  frontend_node_modules:
