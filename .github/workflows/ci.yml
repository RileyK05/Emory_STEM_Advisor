name: CI

# Every push to main and every pull request runs the same checks a reviewer
# would run by hand on a clean machine. See docs/plans/review-readiness.md.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector so retrieval/embedding tables can be created. A skipped DB
        # test counts as a failure in this suite, so the service must be live.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: advisor
          POSTGRES_PASSWORD: advisor
          POSTGRES_DB: advisor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U advisor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://advisor:advisor@localhost:5432/advisor
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps the image small and the install fast; the
          # suite never loads a model, so no GPU build is needed.
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest

  schema:
    name: schema baseline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Verify baseline matches legacy migrations
        # Uses a disposable embedded Postgres; no models or network calls.
        run: python -m scripts.schema_baseline

  frontend:
    name: frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Chromium behavior checks launch Google Chrome, preinstalled on the
      # GitHub-hosted Ubuntu image.
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run format:check
      - run: npm test

  frontend-integration:
    name: frontend integration (experimental)
    # Real API + Postgres + offline fake models. Kept separate and allowed to
    # fail until Chromium/Postgres wiring on CI is settled; see
    # docs/plans/review-readiness.md.
    continue-on-error: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      PYTHON: python
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:integration
