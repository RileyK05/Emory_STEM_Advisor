# Hand-written nudges for the similarity-graph clusters. Optional: an empty
# file (or no file) means the clusters come purely from the embeddings.
# Edit by hand; never generated by a model. Unknown course codes are reported
# by the build and skipped.
#
# together: within one fixed department, share a cluster at every topic level.
# Cross-department requests are ignored with a warning.
#   [[together]]
#   courses = ["ECON 220", "ECON 320"]
#
# apart: push these courses away from each other (best effort; the build
# reports any pair that still lands in the same learned topic).
#   [[apart]]
#   courses = ["MATH 111", "MATH 315"]
#
# label: name the cluster at `level` that contains `course`
# (level 0 = catalog root, level 1 = fixed departments, levels 2+ = topics).
#   [[label]]
#   level = 2
#   course = "ECON 101"
#   text = "Macroeconomics"
