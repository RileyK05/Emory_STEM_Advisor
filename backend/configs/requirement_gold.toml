# Hand-checked expected requirement trees for core STEM courses.
#
# Read by `python -m scripts.manual.data_audit`. `text` is the requirement text
# stored for the course (Atlas registration restrictions, or a labeled
# catalog fallback); the audit flags an entry when that text changes. The
# expected trees are a reading of `text`, never the parser's output.
#
# Notation: all(...), any(...), a course code, or cond:TEXT. `status` is the
# expected parse status; only `parsed` entries carry trees. An entry counts as
# ground truth only after a person compares it with the course's Atlas page
# and sets `reviewed = true`. Entries were drafted 2026-10-28 from the
# Spring 2027 capture and are all unreviewed.

