# Department pages that state program requirements, for `scripts.scrape_programs`.
#
# Emory's college catalog (Coursedog) has no requirement data for any program,
# so these are the departments' own pages. Hand-picked and checked to list
# concrete courses; reviewed 2026-10-08. Where a department posts both an older
# and a newer sheet, only the newer one is listed. Codes and names are the
# catalog's (college.catalog.emory.edu/programs/<CODE>).

