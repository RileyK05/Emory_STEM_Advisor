[project]
name = "emory-stem-advisor-backend"
version = "0.1.0"
description = "Backend for the Emory STEM Advisor RAG system"
requires-python = ">=3.12"
dependencies = [
    # Pinned exactly: MiniCPM-2B-128k ships remote modeling code written
    # against the transformers 4.38 API (later 4.x releases removed
    # DynamicCache.get_max_length and is_torch_fx_available, which it uses).
    # Upgrade only after re-validating the model repo's code against it.
    "transformers==4.38.2",
    "tokenizers>=0.15,<0.19",
    # sentence-transformers 4.x requires transformers>=4.41, which would
    # break the MiniCPM pin above; 3.3.1 is the newest line compatible
    # with 4.38.
    "sentence-transformers==3.3.1",
    "accelerate>=0.26",
    "torch>=2.4",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "numpy",
    # Similarity-graph clustering (agglomerative linkage).
    "scipy",
    "pydantic>=2.6",
    "pypdf>=4",
    # HTTP API. FastAPI's default JSON is pydantic; multipart is for uploads.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pgserver", "httpx"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs Postgres"]

[tool.ruff]
line-length = 100
